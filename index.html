
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Transaction Tracker</title>
</head>
<script src="transactions.js" defer ></script>
<body>
    <h1>revenue</h1>
    <p id="revenue">0</p>
    <input type="text" id="search" name="search" placeholder="search for record">
    <input type="number" id="rev" name="rev" placeholder="Enter amount">
    <input type="text" id="desc" name="desc" placeholder="Enter description">
    <select id="type" >
        <option id="expense" name="expense">expense</option>
        <option id="income" name="income">income</option>
    </select>
    

    <button id="updt_rev">Update Revenue</button>

    <h2>transaction history</h2>
    <ul id="history"></ul>



</body>





</html>
